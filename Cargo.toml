[workspace]
resolver = "2"
members = [
    "viveco",
    "viveco-editor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/viveco"

[workspace.dependencies]
viveco = { path = "viveco" }
bevy = "0.19"
bevy_vello = "0.14"
bevy_egui = "0.41"
vello = "0.9"
# SVG parsing for `viveco`'s shape importer. Text support is disabled because
# the importer only deals with geometry.
usvg = { version = "0.46", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

# Bevy/Vello are much slower in a fully unoptimized build, but we do not want
# to wait for an optimized build of our own (small) crates either.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
